[project]
name = "tpi-decision-intelligence-eaymr"
version = "0.1.0"
description = "Decision Intelligence Capstone - EAyMR 2026 (UCA): retorno causal de un motor de recomendaciones/cupones"
requires-python = ">=3.10,<3.13"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks", "data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["N803", "N806"]  # permitir X_train, X_test (convención estadística)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
